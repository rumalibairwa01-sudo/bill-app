<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill App</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:15px;
}

.app{
  max-width:500px;
  margin:auto;
}

h1,h2{
  text-align:center;
}

.box{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
}

input,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:6px 0 10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  background:#222;
  color:white;
  border:0;
}

.item{
  border:1px solid #ddd;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.remove{
  background:#c62828;
}

.whatsapp{
  background:#168c38;
}

.total{
  font-size:20px;
  font-weight:bold;
}

#bill{
  display:none;
}
</style>
</head>

<body>

<div class="app">

<h1>🧾 Bill App</h1>

<div class="box">

<label>नाम</label>

<input
  id="customerName"
  type="text"
  placeholder="Customer name">


<h3>कपड़े</h3>

<div id="items"></div>

<button
  type="button"
  onclick="addItem()">

➕ Add More

</button>


<label>Paid Amount (₹)</label>

<input
  id="paid"
  type="number"
  min="0"
  placeholder="Kitna paisa mila">


<button
  type="button"
  onclick="makeBill()">

🧾 Bill Banao

</button>

</div>


<!-- BILL -->

<div
  class="box"
  id="bill">

<h2>🧾 BILL</h2>

<p>
<b>नाम:</b>
<span id="showName"></span>
</p>

<div id="showItems"></div>

<hr>

<p class="total">
Total: ₹<span id="showTotal">0</span>
</p>

<p>
Paid: ₹<span id="showPaid">0</span>
</p>

<p>
<b>
Pending: ₹<span id="showPending">0</span>
</b>
</p>

<button
  class="whatsapp"
  type="button"
  onclick="sendWhatsApp()">

📲 WhatsApp पर भेजो

</button>

</div>

</div>


<script>

/* =========================
   CURRENT BILL
========================= */

let currentBill = null;


/* =========================
   ADD ITEM
========================= */

function addItem(){

  const item = document.createElement("div");

  item.className = "item";

  item.innerHTML = `

    <label>कपड़े का नाम</label>

    <input
      class="cloth"
      type="text"
      placeholder="जैसे Blouse, Suit">


    <label>Quantity</label>

    <input
      class="qty"
      type="number"
      min="1"
      placeholder="कितने">


    <label>Rate (₹)</label>

    <input
      class="rate"
      type="number"
      min="0"
      placeholder="एक का rate">


    <button
      class="remove"
      type="button"
      onclick="this.parentElement.remove()">

      ❌ Remove

    </button>

  `;

  document
    .getElementById("items")
    .appendChild(item);
}


/* पहली item अपने-आप */

addItem();


/* =========================
   GET ITEMS
========================= */

function getItems(){

  const items = [];

  document
    .querySelectorAll(".item")
    .forEach(item => {

      const cloth =
        item
          .querySelector(".cloth")
          .value
          .trim();

      const qty =
        Number(
          item
            .querySelector(".qty")
            .value
        );

      const rate =
        Number(
          item
            .querySelector(".rate")
            .value
        );


      if(cloth && qty > 0 && rate >= 0){

        items.push({

          cloth: cloth,

          qty: qty,

          rate: rate,

          amount: qty * rate

        });

      }

    });

  return items;
}


/* =========================
   MAKE BILL
========================= */

function makeBill(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const paid =
    Number(
      document
        .getElementById("paid")
        .value
    ) || 0;


  const items = getItems();


  if(!name){

    alert("⚠️ पहले नाम लिखो");

    return;
  }


  if(items.length === 0){

    alert(
      "⚠️ कपड़े का नाम, quantity और rate भरो"
    );

    return;
  }


  const total =
    items.reduce(
      (sum,item) =>
        sum + item.amount,
      0
    );


  const pending =
    total - paid;


  /* BILL OBJECT */

  currentBill = {

    id: Date.now(),

    name: name,

    items: items,

    total: total,

    paid: paid,

    pending: pending,

    date: new Date().toLocaleString()

  };


  /* =========================
     AUTOMATIC SAVE
  ========================= */

  let savedBills =
    JSON.parse(
      localStorage.getItem("savedBills")
    ) || [];


  savedBills.push(currentBill);


  localStorage.setItem(
    "savedBills",
    JSON.stringify(savedBills)
  );


  /* =========================
     SHOW BILL
  ========================= */

  document
    .getElementById("showName")
    .textContent = name;


  let html = "";


  items.forEach(item => {

    html += `

      <p>

        <b>${escapeHTML(item.cloth)}</b>

        — ${item.qty} × ₹${item.rate}

        = ₹${item.amount}

      </p>

    `;

  });


  document
    .getElementById("showItems")
    .innerHTML = html;


  document
    .getElementById("showTotal")
    .textContent = total;


  document
    .getElementById("showPaid")
    .textContent = paid;


  document
    .getElementById("showPending")
    .textContent = pending;


  document
    .getElementById("bill")
    .style.display = "block";


  alert("✅ Bill save हो गया!");

}


/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

  if(!currentBill){

    alert("⚠️ पहले Bill बनाओ");

    return;
  }


  let message =
    "🧾 BILL\n\n";


  message +=
    "नाम: "
    + currentBill.name
    + "\n\n";


  currentBill.items.forEach(item => {

    message +=
      item.cloth
      + " — "
      + item.qty
      + " × ₹"
      + item.rate
      + " = ₹"
      + item.amount
      + "\n";

  });


  message +=
    "\nTotal: ₹"
    + currentBill.total;


  message +=
    "\nPaid: ₹"
    + currentBill.paid;


  message +=
    "\nPending: ₹"
    + currentBill.pending;


  const whatsappURL =
    "https://wa.me/?text="
    + encodeURIComponent(message);


  window.open(
    whatsappURL,
    "_blank"
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>


<script>

if("serviceWorker" in navigator){

  navigator
    .serviceWorker
    .register("./sw.js")
    .catch(function(error){

      console.log(
        "Service Worker error:",
        error
      );

    });

}

</script>

</body>
</html>
