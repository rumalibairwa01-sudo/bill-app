<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill App</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:15px;
}
.app{
  max-width:500px;
  margin:auto;
}
h1{text-align:center}
.box{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
}
input,select,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:6px 0 10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button{
  background:#222;
  color:white;
  border:0;
}
.item{
  border:1px solid #ddd;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
.remove{
  background:#c62828;
}
.total{
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<h1>🧾 Bill App</h1>

<div class="box">

<label>Language</label>
<select id="language">
<option>Hi-English</option>
<option>English</option>
<option>हिंदी</option>
</select>

<label>Customer Name</label>
<input id="customerName" placeholder="Customer name">

<h3>Kapde</h3>

<div id="items"></div>

<button onclick="addItem()">➕ Add Item</button>

<label>Paid Amount (₹)</label>
<input type="number" id="paid" placeholder="Kitna paisa mila">

<button onclick="makeBill()">🧾 Bill Banao</button>

</div>

<div class="box" id="bill" style="display:none">

<h2>🧾 BILL</h2>

<p><b>Customer:</b> <span id="showName"></span></p>

<div id="showItems"></div>

<hr>

<p class="total">Total: ₹<span id="showTotal"></span></p>
<p>Paid: ₹<span id="showPaid"></span></p>
<p><b>Pending: ₹<span id="showPending"></span></b></p>

<button onclick="sendWhatsApp()">📲 WhatsApp par bhejo</button>

</div>

</div>

<script>

function addItem(){

  let div=document.createElement("div");
  div.className="item";

  div.innerHTML=`
    <label>Kapde ka naam</label>
    <input class="cloth" placeholder="Jaise Blouse, Kurta, Saree">

    <label>Quantity</label>
    <input class="qty" type="number" placeholder="Kitne">

    <label>Rate (₹)</label>
    <input class="rate" type="number" placeholder="Ek ka rate">

    <button class="remove" onclick="this.parentElement.remove()">
    ❌ Remove
    </button>
  `;

  document.getElementById("items").appendChild(div);
}

addItem();

function getItems(){

  let items=[];

  document.querySelectorAll(".item").forEach(item=>{

    let cloth=item.querySelector(".cloth").value;
    let qty=Number(item.querySelector(".qty").value);
    let rate=Number(item.querySelector(".rate").value);

    if(cloth && qty && rate){
      items.push({
        cloth:cloth,
        qty:qty,
        rate:rate,
        amount:qty*rate
      });
    }

  });

  return items;
}

function makeBill(){

  let name=document.getElementById("customerName").value;
  let paid=Number(document.getElementById("paid").value)||0;

  let items=getItems();

  let total=items.reduce((sum,item)=>sum+item.amount,0);
  let pending=total-paid;

  document.getElementById("showName").innerText=name;

  let html="";

  items.forEach(item=>{
    html+=`
      <p>
      <b>${item.cloth}</b> —
      ${item.qty} × ₹${item.rate}
      = ₹${item.amount}
      </p>
    `;
  });

  document.getElementById("showItems").innerHTML=html;
  document.getElementById("showTotal").innerText=total;
  document.getElementById("showPaid").innerText=paid;
  document.getElementById("showPending").innerText=pending;

  document.getElementById("bill").style.display="block";
}

function sendWhatsApp(){

  let name=document.getElementById("customerName").value;
  let paid=Number(document.getElementById("paid").value)||0;
  let items=getItems();

  let total=items.reduce((sum,item)=>sum+item.amount,0);
  let pending=total-paid;

  let message="🧾 BILL\n\n";
  message+="Customer: "+name+"\n\n";

  items.forEach(item=>{
    message+=item.cloth+" — "+item.qty+" × ₹"+item.rate+
    " = ₹"+item.amount+"\n";
  });

  message+="\nTotal: ₹"+total;
  message+="\nPaid: ₹"+paid;
  message+="\nPending: ₹"+pending;

  window.open(
    "https://wa.me/?text="+encodeURIComponent(message),
    "_blank"
  );
}

</script>

</body>
</html>
