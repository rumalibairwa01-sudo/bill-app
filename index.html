<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Bill App</title>

<link rel="manifest" href="manifest.json">

<style>

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:15px;
}

.app{
  max-width:500px;
  margin:auto;
}

h1,h2{
  text-align:center;
}

.box{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
}

input,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:6px 0 10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  background:#222;
  color:white;
  border:0;
}

.item{
  border:1px solid #ddd;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.remove,
.delete{
  background:#c62828;
}

.whatsapp{
  background:#168c38;
}

.saved{
  background:#1976d2;
}

.back{
  background:#555;
}

.saved-card{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
  background:#fafafa;
}

.total{
  font-size:20px;
  font-weight:bold;
}

#bill{
  display:none;
}

.app.saved-open > :not(#savedBillsPage){
  display:none;
}

</style>

</head>


<body>

<div class="app">


<!-- HOME -->

<h1>🧾 Bill App</h1>


<div class="box">

<label>नाम</label>

<input
  id="customerName"
  type="text"
  placeholder="Customer name">


<h3>कपड़े</h3>

<div id="items"></div>


<button
  type="button"
  onclick="addItem()">

➕ Add More

</button>


<label>Paid Amount (₹)</label>

<input
  id="paid"
  type="number"
  min="0"
  placeholder="Kitna paisa mila">


<button
  type="button"
  onclick="makeBill()">

🧾 Bill Banao

</button>


<button
  class="saved"
  type="button"
  onclick="showSavedBills()">

📂 Saved Bills

</button>

</div>



<!-- BILL -->

<div
  class="box"
  id="bill">

<h2>🧾 BILL</h2>


<p>
<b>नाम:</b>
<span id="showName"></span>
</p>


<div id="showItems"></div>

<hr>


<p class="total">
Total: ₹<span id="showTotal">0</span>
</p>


<p>
Paid: ₹<span id="showPaid">0</span>
</p>


<p>
<b>
Pending: ₹<span id="showPending">0</span>
</b>
</p>


<button
  class="whatsapp"
  type="button"
  onclick="sendWhatsApp()">

📲 WhatsApp पर भेजो

</button>

</div>



<!-- SAVED BILLS PAGE -->

<div
  id="savedBillsPage"
  class="box"
  style="display:none;">

<h2>📂 Saved Bills</h2>

<div id="savedBillsList"></div>


<button
  class="back"
  type="button"
  onclick="goHome()">

⬅️ वापस

</button>

</div>


</div>



<script>


/* CURRENT BILL */

let currentBill = null;



/* ADD ITEM */

function addItem(){

  const item =
    document.createElement("div");

  item.className = "item";


  item.innerHTML = `

    <label>कपड़े का नाम</label>

    <input
      class="cloth"
      type="text"
      placeholder="जैसे Blouse, Suit">


    <label>Quantity</label>

    <input
      class="qty"
      type="number"
      min="1"
      placeholder="कितने">


    <label>Rate (₹)</label>

    <input
      class="rate"
      type="number"
      min="0"
      placeholder="एक का rate">


    <button
      class="remove"
      type="button"
      onclick="this.parentElement.remove()">

      ❌ Remove

    </button>

  `;


  document
    .getElementById("items")
    .appendChild(item);

}


/* FIRST ITEM */

addItem();



/* GET ITEMS */

function getItems(){

  const items = [];


  document
    .querySelectorAll(".item")
    .forEach(item => {

      const cloth =
        item
          .querySelector(".cloth")
          .value
          .trim();


      const qty =
        Number(
          item
            .querySelector(".qty")
            .value
        );


      const rate =
        Number(
          item
            .querySelector(".rate")
            .value
        );


      if(
        cloth &&
        qty > 0 &&
        rate >= 0
      ){

        items.push({

          cloth:cloth,

          qty:qty,

          rate:rate,

          amount:qty * rate

        });

      }

    });


  return items;

}



/* MAKE BILL */

function makeBill(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const paid =
    Number(
      document
        .getElementById("paid")
        .value
    ) || 0;


  const items = getItems();


  if(!name){

    alert("⚠️ पहले नाम लिखो");

    return;

  }


  if(items.length === 0){

    alert(
      "⚠️ कपड़े का नाम, quantity और rate भरो"
    );

    return;

  }


  const total =
    items.reduce(
      (sum,item) =>
        sum + item.amount,
      0
    );


  if(paid > total){

    alert(
      "⚠️ Paid amount Total से ज्यादा नहीं हो सकता"
    );

    return;

  }


  const pending =
    total - paid;


  currentBill = {

    id:Date.now(),

    name:name,

    items:items,

    total:total,

    paid:paid,

    pending:pending,

    date:new Date().toLocaleString()

  };



  /* SAVE BILL */

  let savedBills =
    JSON.parse(
      localStorage.getItem("savedBills")
    ) || [];


  savedBills.push(currentBill);


  localStorage.setItem(
    "savedBills",
    JSON.stringify(savedBills)
  );



  /* SHOW BILL */

  document
    .getElementById("showName")
    .textContent = name;


  let html = "";


  items.forEach(item => {

    html += `

      <p>

        <b>${escapeHTML(item.cloth)}</b>

        — ${item.qty} × ₹${item.rate}

        = ₹${item.amount}

      </p>

    `;

  });


  document
    .getElementById("showItems")
    .innerHTML = html;


  document
    .getElementById("showTotal")
    .textContent = total;


  document
    .getElementById("showPaid")
    .textContent = paid;


  document
    .getElementById("showPending")
    .textContent = pending;


  document
    .getElementById("bill")
    .style.display = "block";


  alert("✅ Bill save हो गया!");

}



/* SAVED BILLS */

function showSavedBills(){

  document
    .querySelector(".app")
    .classList.add("saved-open");


  document
    .getElementById("savedBillsPage")
    .style.display = "block";


  loadSavedBills();

}



/* GO HOME */

function goHome(){

  document
    .getElementById("savedBillsPage")
    .style.display = "none";


  document
    .querySelector(".app")
    .classList.remove("saved-open");

}



/* LOAD SAVED BILLS */

function loadSavedBills(){

  const bills =
    JSON.parse(
      localStorage.getItem("savedBills")
    ) || [];


  const list =
    document.getElementById(
      "savedBillsList"
    );


  list.innerHTML = "";


  if(bills.length === 0){

    list.innerHTML =
      "<p style='text-align:center;'>📂 अभी कोई Saved Bill नहीं है।</p>";

    return;

  }



  bills
    .slice()
    .reverse()
    .forEach(bill => {


      const card =
        document.createElement("div");


      card.className =
        "saved-card";


      let itemsHTML = "";


      bill.items.forEach(item => {

        itemsHTML += `

          <p>

            <b>
              ${escapeHTML(item.cloth)}
            </b>

            — ${item.qty} × ₹${item.rate}

            = ₹${item.amount}

          </p>

        `;

      });



      card.innerHTML = `

        <h3>
          👤 ${escapeHTML(bill.name)}
        </h3>

        ${itemsHTML}

        <hr>

        <p>
          <b>Total:</b>
          ₹${bill.total}
        </p>

        <p>
          Paid: ₹${bill.paid}
        </p>

        <p>
          <b>Pending:</b>
          ₹${bill.pending}
        </p>

        <small>
          ${escapeHTML(bill.date)}
        </small>


        <button
          class="delete"
          type="button"
          onclick="deleteBill(${bill.id})">

          🗑️ Delete

        </button>

      `;


      list.appendChild(card);

    });

}



/* DELETE BILL */

function deleteBill(id){

  const answer =
    confirm(
      "क्या यह Bill delete करना है?"
    );


  if(!answer){

    return;

  }


  let bills =
    JSON.parse(
      localStorage.getItem("savedBills")
    ) || [];


  bills =
    bills.filter(
      bill => bill.id !== id
    );


  localStorage.setItem(
    "savedBills",
    JSON.stringify(bills)
  );


  loadSavedBills();


  alert("✅ Bill delete हो गया!");

}



/* WHATSAPP */

function sendWhatsApp(){

  if(!currentBill){

    alert("⚠️ पहले Bill बनाओ");

    return;

  }


  let message =
    "🧾 BILL\n\n";


  message +=
    "नाम: "
    + currentBill.name
    + "\n\n";


  currentBill.items.forEach(item => {

    message +=
      item.cloth
      + " — "
      + item.qty
      + " × ₹"
      + item.rate
      + " = ₹"
      + item.amount
      + "\n";

  });


  message +=
    "\nTotal: ₹"
    + currentBill.total;


  message +=
    "\nPaid: ₹"
    + currentBill.paid;


  message +=
    "\nPending: ₹"
    + currentBill.pending;


  const whatsappURL =
    "https://wa.me/?text="
    + encodeURIComponent(message);


  window.open(
    whatsappURL,
    "_blank"
  );

}



/* SECURITY */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>



<script>

if("serviceWorker" in navigator){

  navigator
    .serviceWorker
    .register("./sw.js")
    .catch(function(error){

      console.log(
        "Service Worker error:",
        error
      );

    });

}

</script>


</body>

  </html>
