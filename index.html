<script>


/* =====================================================
   GENERAL
===================================================== */

let currentBill = null;

let currentSavedBill = null;

let currentSavedMeasurement = null;



/* =====================================================
   BILL - ADD ITEM
===================================================== */

function addItem(){

  let div =
  document.createElement("div");

  div.className = "item";

  div.innerHTML = `

    <label>Kapde ka naam</label>

    <input
    class="cloth"
    placeholder="Jaise Blouse, Kurta, Saree">


    <label>Quantity</label>

    <input
    class="qty"
    type="number"
    placeholder="Kitne">


    <label>Rate (₹)</label>

    <input
    class="rate"
    type="number"
    placeholder="Ek ka rate">


    <button
    class="remove"
    onclick="this.parentElement.remove()">

    ❌ Remove

    </button>

  `;

  document
  .getElementById("items")
  .appendChild(div);

}

addItem();



/* =====================================================
   BILL - GET ITEMS
===================================================== */

function getItems(){

  let items = [];

  document
  .querySelectorAll(".item")
  .forEach(item => {

    let cloth =
    item
    .querySelector(".cloth")
    .value
    .trim();

    let qty =
    Number(
      item
      .querySelector(".qty")
      .value
    );

    let rate =
    Number(
      item
      .querySelector(".rate")
      .value
    );

    if(cloth && qty > 0 && rate > 0){

      items.push({

        cloth:cloth,

        qty:qty,

        rate:rate,

        amount:qty * rate

      });

    }

  });

  return items;

}



/* =====================================================
   BILL - MAKE & AUTO SAVE
===================================================== */

function makeBill(){

  let name =
  document
  .getElementById("customerName")
  .value
  .trim();

  let paid =
  Number(
    document
    .getElementById("paid")
    .value
  ) || 0;

  let items = getItems();


  if(!name){

    alert("⚠️ Customer name डालो");

    return;

  }


  if(items.length === 0){

    alert("⚠️ कम से कम एक item डालो");

    return;

  }


  let total =
  items.reduce(
    (sum,item) =>
    sum + item.amount,
    0
  );


  let pending =
  total - paid;


  currentBill = {

    id:Date.now(),

    name:name,

    items:items,

    total:total,

    paid:paid,

    pending:pending,

    date:new Date()
    .toLocaleString()

  };


  /* AUTO SAVE */

  let bills =
  JSON.parse(
    localStorage
    .getItem("savedBills")
  ) || [];


  bills.push(currentBill);


  localStorage.setItem(
    "savedBills",
    JSON.stringify(bills)
  );


  /* SHOW BILL */

  document
  .getElementById("showName")
  .innerText = name;


  let html = "";


  items.forEach(item => {

    html += `

      <p>

      <b>${escapeHTML(item.cloth)}</b>

      —

      ${item.qty}
      ×
      ₹${item.rate}

      =
      ₹${item.amount}

      </p>

    `;

  });


  document
  .getElementById("showItems")
  .innerHTML = html;


  document
  .getElementById("showTotal")
  .innerText = total;


  document
  .getElementById("showPaid")
  .innerText = paid;


  document
  .getElementById("showPending")
  .innerText = pending;


  document
  .getElementById("bill")
  .style.display = "block";


  alert("✅ Bill automatically save ho gaya!");

}



/* =====================================================
   SAVED BILLS
===================================================== */

function showSavedBills(){

  hideAllPages();

  document
  .getElementById("savedPage")
  .style.display = "block";

  loadSavedBills();

}


function loadSavedBills(){

  let bills =
  JSON.parse(
    localStorage
    .getItem("savedBills")
  ) || [];


  let list =
  document
  .getElementById("savedBillsList");


  list.innerHTML = "";


  if(bills.length === 0){

    list.innerHTML = `

      <div class="empty">

      📂 अभी कोई saved bill नहीं है।

      </div>

    `;

    return;

  }


  bills
  .slice()
  .reverse()
  .forEach(bill => {

    let div =
    document.createElement("div");

    div.className =
    "saved-bill";


    div.innerHTML = `

      <p>
      <b>👤 Customer:</b>
      ${escapeHTML(bill.name)}
      </p>

      <p>
      💰 Total: ₹${bill.total}
      </p>

      <p>
      💵 Paid: ₹${bill.paid}
      </p>

      <p>
      ⏳ Pending: ₹${bill.pending}
      </p>

      <p>
      📅 ${bill.date}
      </p>

      <button
      class="view"
      onclick="viewBill(${bill.id})">

      👁️ View Bill

      </button>


      <button
      class="delete"
      onclick="deleteBill(${bill.id})">

      🗑️ Delete

      </button>

    `;

    list.appendChild(div);

  });

}



/* =====================================================
   VIEW BILL
===================================================== */

function viewBill(id){

  let bills =
  JSON.parse(
    localStorage
    .getItem("savedBills")
  ) || [];


  let bill =
  bills.find(
    b => b.id === id
  );


  if(!bill){

    alert("Bill नहीं मिला");

    return;

  }


  currentSavedBill = bill;


  let html = `

    <p>
    <b>👤 Customer:</b>
    ${escapeHTML(bill.name)}
    </p>

  `;


  bill.items.forEach(item => {

    html += `

      <p>

      <b>
      ${escapeHTML(item.cloth)}
      </b>

      —

      ${item.qty}
      × ₹${item.rate}

      = ₹${item.amount}

      </p>

    `;

  });


  html += `

    <hr>

    <p class="total">
    Total: ₹${bill.total}
    </p>

    <p>
    Paid: ₹${bill.paid}
    </p>

    <p>
    <b>Pending: ₹${bill.pending}</b>
    </p>

    <p>
    📅 ${bill.date}
    </p>

  `;


  document
  .getElementById("savedBillDetails")
  .innerHTML = html;


  hideAllPages();

  document
  .getElementById("viewPage")
  .style.display = "block";

}



/* =====================================================
   DELETE BILL
===================================================== */

function deleteBill(id){

  let answer =
  confirm(
    "⚠️ क्या आप यह bill delete करना चाहते हैं?"
  );


  if(!answer){

    return;

  }


  let bills =
  JSON.parse(
    localStorage
    .getItem("savedBills")
  ) || [];


  bills =
  bills.filter(
    bill => bill.id !== id
  );


  localStorage.setItem(
    "savedBills",
    JSON.stringify(bills)
  );


  currentSavedBill = null;


  alert("🗑️ Bill delete हो गया");


  showSavedBills();

}


function deleteCurrentBill(){

  if(currentSavedBill){

    deleteBill(
      currentSavedBill.id
    );

  }

}



/* =====================================================
   WHATSAPP
===================================================== */

function sendWhatsApp(){

  if(!currentBill){

    alert("Pehle bill banao");

    return;

  }

  sendBillToWhatsApp(currentBill);

}


function sendSavedWhatsApp(){

  if(!currentSavedBill){

    return;

  }

  sendBillToWhatsApp(
    currentSavedBill
  );

}


function sendBillToWhatsApp(bill){

  let message =
  "🧾 BILL\n\n";


  message +=
  "Customer: "
  + bill.name
  + "\n\n";


  bill.items.forEach(item => {

    message +=
    item.cloth
    + " — "
    + item.qty
    + " × ₹"
    + item.rate
    + " = ₹"
    + item.amount
    + "\n";

  });


  message +=
  "\nTotal: ₹"
  + bill.total;


  message +=
  "\nPaid: ₹"
  + bill.paid;


  message +=
  "\nPending: ₹"
  + bill.pending;


  window.open(

    "https://wa.me/?text="
    + encodeURIComponent(message),

    "_blank"

  );

}



/* =====================================================
   MEASUREMENT PAGE
===================================================== */

function showMeasurementPage(){

  hideAllPages();

  document
  .getElementById("measurementPage")
  .style.display = "block";

}



/* =====================================================
   SAVE MEASUREMENT
===================================================== */

function saveMeasurement(){

  let name =
  document
  .getElementById("measureName")
  .value
  .trim();


  if(!name){

    alert("⚠️ नाम लिखें");

    return;

  }


  /*
    Empty fields stay empty.
    Nothing is converted to 0.
  */

  let measurement = {

    id:Date.now(),

    name:name,

    chhati:
    document.getElementById("chhati").value,

    kamar:
    document.getElementById("kamar").value,

    hip:
    document.getElementById("hip").value,

    baju:
    document.getElementById("baju").value,

    golai:
    document.getElementById("golai").value,

    lambai:
    document.getElementById("lambai").value,

    salwarPant:
    document.getElementById("salwarPant").value,

    galAage:
    document.getElementById("galAage").value,

    galaPeeche:
    document.getElementById("galaPeeche").value,

    date:
    new Date().toLocaleString()

  };


  let measurements =
  JSON.parse(
    localStorage
    .getItem("measurements")
  ) || [];


  measurements.push(
    measurement
  );


  localStorage.setItem(
    "measurements",
    JSON.stringify(measurements)
  );


  alert("✅ नाप सुरक्षित हो गया!");


  clearMeasurementForm();

}



/* =====================================================
   CLEAR MEASUREMENT FORM
===================================================== */

function clearMeasurementForm(){

  document
  .getElementById("measureName")
  .value = "";

  document
  .getElementById("chhati")
  .value = "";

  document
  .getElementById("kamar")
  .value = "";

  document
  .getElementById("hip")
  .value = "";

  document
  .getElementById("baju")
  .value = "";

  document
  .getElementById("golai")
  .value = "";

  document
  .getElementById("lambai")
  .value = "";

  document
  .getElementById("salwarPant")
  .value = "";

  document
  .getElementById("galAage")
  .value = "";

  document
  .getElementById("galaPeeche")
  .value = "";

}



/* =====================================================
   SAVED MEASUREMENTS
===================================================== */

function showSavedMeasurements(){

  hideAllPages();

  document
  .getElementById("savedMeasurementPage")
  .style.display = "block";


  loadSavedMeasurements();

}


function loadSavedMeasurements(){

  let measurements =
  JSON.parse(
    localStorage
    .getItem("measurements")
  ) || [];


  let list =
  document
  .getElementById("savedMeasurementsList");


  list.innerHTML = "";


  if(measurements.length === 0){

    list.innerHTML = `

      <div class="empty">

      📂 अभी कोई नाप सुरक्षित नहीं है।

      </div>

    `;

    return;

  }


  measurements
  .slice()
  .reverse()
  .forEach(measurement => {

    let div =
    document.createElement("div");


    div.className =
    "saved-measure";


    div.innerHTML = `

      <p>
      <b>👤 नाम:</b>
      ${escapeHTML(measurement.name)}
      </p>

      <p>
      📅 ${measurement.date}
      </p>


      <button
      class="view"
      onclick="viewMeasurement(${measurement.id})">

      👁️ नाप देखें

      </button>


      <button
      class="delete"
      onclick="deleteMeasurement(${measurement.id})">

      🗑️ Delete

      </button>

    `;


    list.appendChild(div);

  });

}



/* =====================================================
   VIEW MEASUREMENT
===================================================== */

function viewMeasurement(id){

  let measurements =
  JSON.parse(
    localStorage
    .getItem("measurements")
  ) || [];


  let measurement =
  measurements.find(
    m => m.id === id
  );


  if(!measurement){

    alert("नाप नहीं मिला");

    return;

  }


  currentSavedMeasurement =
  measurement;


  let html = `

    <p>
    <b>नाम:</b>
    ${escapeHTML(measurement.name)}
    </p>

  `;


  addMeasurementLine(
    "छाती",
    measurement.chhati,
    value => value
  );


  html += measurementLine(
    "छाती",
    measurement.chhati
  );


  html += measurementLine(
    "कमर",
    measurement.kamar
  );


  html += measurementLine(
    "हिप",
    measurement.hip
  );


  html += measurementLine(
    "बाजू",
    measurement.baju
  );


  html += measurementLine(
    "गोलाई",
    measurement.golai
  );


  html += measurementLine(
    "लंबाई",
    measurement.lambai
  );


  html += measurementLine(
    "सलवार/पेंट",
    measurement.salwarPant
  );


  html += measurementLine(
    "गाल आगे का",
    measurement.galAage
  );


  html += measurementLine(
    "गला पीछे का",
    measurement.galaPeeche
  );


  html += `

    <p>
    📅 ${measurement.date}
    </p>

  `;


  document
  .getElementById("measurementDetails")
  .innerHTML = html;


  hideAllPages();


  document
  .getElementById("viewMeasurementPage")
  .style.display = "block";

}



/* =====================================================
   MEASUREMENT LINE
===================================================== */

function measurementLine(label,value){

  if(value === "" ||
     value === null ||
     value === undefined){

    return "";

  }


  return `

    <p>

    <b>${label}:</b>

    ${escapeHTML(value)}

    इंच

    </p>

  `;

}


/* This function intentionally does nothing.
   It is only kept harmlessly for compatibility. */

function addMeasurementLine(){

}



/* =====================================================
   DELETE MEASUREMENT
===================================================== */

function deleteMeasurement(id){

  let answer =
  confirm(
    "⚠️ क्या आप यह नाप delete करना चाहते हैं?"
  );


  if(!answer){

    return;

  }


  let measurements =
  JSON.parse(
    localStorage
    .getItem("measurements")
  ) || [];


  measurements =
  measurements.filter(
    measurement =>
    measurement.id !== id
  );


  localStorage.setItem(
    "measurements",
    JSON.stringify(measurements)
  );


  currentSavedMeasurement = null;


  alert("🗑️ नाप delete हो गया");


  showSavedMeasurements();

}


function deleteCurrentMeasurement(){

  if(currentSavedMeasurement){

    deleteMeasurement(
      currentSavedMeasurement.id
    );

  }

}



/* =====================================================
   PAGE CONTROL
=================================================
